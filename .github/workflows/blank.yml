name: Build Android APK from ZIP

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Extract ZIP and Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' | head -n 1)"
          if [ -z "${ZIP_FILE}" ]; then
            echo "No ZIP file found. Upload TotakFront_GitHub.zip first."
            exit 1
          fi
          rm -rf extracted_flutter
          mkdir extracted_flutter
          unzip -q "${ZIP_FILE}" -d extracted_flutter
          PUBSPEC="$(find extracted_flutter -name pubspec.yaml -not -path '*/.dart_tool/*' | head -n 1)"
          if [ -z "${PUBSPEC}" ]; then
            echo "pubspec.yaml was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "${PUBSPEC}")"
          echo "PROJECT_DIR=${PROJECT_DIR}" >> "$GITHUB_ENV"
          echo "Flutter project found at ${PROJECT_DIR}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name totak_front --org com.totak --no-pub .
          fi

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: totak-android-release
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
